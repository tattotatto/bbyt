# ============================================================
# HX Mall Nginx 反代配置（服务器已有 nginx，仅需加 location 块）
#
# 用法：把下方「location 片段」粘贴进你现有 nginx server 块的
#       443（或 80）server 内，然后：nginx -t && nginx -s reload
#
# 说明：
#   - 后端容器已将 7000 发布到宿主机 → 反代到 127.0.0.1:7000
#   - 如果你的 nginx 是容器运行：把 proxy_pass 改成
#     http://host.docker.internal:7000，并在容器加 extra_hosts:
#     host.docker.internal:host-gateway
# ============================================================

# ────────────────────────────────────────────────────────────
# ① location 片段（粘贴进现有 server 块，适合已有域名的 nginx）
# ────────────────────────────────────────────────────────────
    # ---- WebSocket：AI 对话通道 ----
    location /api/v1/ai/ws/chat {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 后端 API ----
    location /api/v1/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 上传文件 ----
    location /static/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
    }

    # ---- 管理后台 SPA（构建 base=/admin/，资源在 /admin/assets） ----
    location /admin/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /admin {
        return 301 /admin/;
    }

# ────────────────────────────────────────────────────────────
