# ============================================================
# HX Mall 生产 Nginx 配置（HTTPS）
# 用法：修改域名与证书路径后放到 /etc/nginx/conf.d/hxmall.conf
#   然后：nginx -t && systemctl reload nginx
# 前置：后端容器 hxmall-api-1 已监听宿主机 7000 端口
# ============================================================

# 80 → 443 跳转
server {
    listen 80;
    server_name baby.mx.yn.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name baby.mx.yn.cn;

    # ↓↓↓ 改成你的证书实际路径（certbot 或云厂商证书） ↓↓↓
    ssl_certificate     /etc/letsencrypt/live/baby.mx.yn.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baby.mx.yn.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # ---- WebSocket：AI 对话通道 ----
    location /api/v1/ai/ws/chat {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 后端 API ----
    location /api/v1/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 上传文件 ----
    location /static/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
    }

    # ---- 管理后台 SPA（构建 base=/admin/，资源在 /admin/assets） ----
    location /admin/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /admin {
        return 301 /admin/;
    }
}
