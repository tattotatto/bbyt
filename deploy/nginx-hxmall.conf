# ============================================================
# HX Mall B2B 批发商城 — Nginx 配置
# 用途：托管管理后台 SPA + 代理后端 API
# 部署路径：放到服务器 /etc/nginx/conf.d/ 或现有 nginx 容器中
# ============================================================

server {
    listen 80;
    server_name admin.hxmall.com;   # 改成实际的管理后台域名

    # ===== 管理后台 SPA 静态文件 =====
    # admin/dist 目录拷贝到 /opt/hxmall-admin/dist
    root /opt/hxmall-admin/dist;
    index index.html;

    # ===== API 代理到后端 =====
    location /api/v1/ai/ws/chat {
        # WebSocket：AI 对话通道
        proxy_pass http://hxmall-api:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/v1/ {
        # 后端 API（FastAPI）
        proxy_pass http://hxmall-api:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # ===== SPA 路由回退 =====
    # Vue Router history 模式：所有非文件路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        # 添加静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

# ============================================================
# 如果管理后台和其他服务共用同一个 nginx（如 hxbaby nginx），
# 可以在现有 server 块中添加以下 location 块：
# ============================================================

