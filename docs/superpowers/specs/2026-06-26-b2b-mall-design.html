<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>B2B 儿童产品批发商城 — 系统设计文档 v2.0</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #FFF8F0; --card-bg: #ffffff; --text: #4a3728;
    --text-secondary: #7a6a5a; --border: #f0e0d0;
    --accent: #FF7B7B; --accent-light: #FFF0ED;
    --blue: #7EC8E3; --green: #A8D8B9; --yellow: #FFD93D;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #FFF8F0 0%, #FFF0ED 50%, #FFF8F0 100%);
    color: var(--text); line-height: 1.8;
    padding: 40px 20px;
  }
  .container {
    max-width: 920px; margin: 0 auto;
    background: var(--card-bg); border-radius: 24px;
    box-shadow: 0 2px 8px rgba(255,123,123,0.06), 0 8px 32px rgba(0,0,0,0.04);
    padding: 60px 64px;
  }
  @media (max-width: 768px) {
    .container { padding: 28px 22px; border-radius: 16px; }
    body { padding: 16px 10px; }
  }
  h1 { font-size: 2em; margin-bottom: 6px; color: #FF7B7B; letter-spacing: -0.02em; }
  h2 { font-size: 1.4em; margin: 44px 0 14px; padding-bottom: 10px; border-bottom: 2px solid var(--border); color: #5a3e2b; }
  h3 { font-size: 1.15em; margin: 28px 0 10px; color: #6b4c3b; }
  h4 { font-size: 1.05em; margin: 20px 0 8px; color: var(--text); }
  p { margin: 10px 0; }
  strong { color: #3a2010; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  blockquote {
    border-left: 4px solid var(--accent); background: var(--accent-light);
    padding: 12px 20px; margin: 16px 0;
    border-radius: 0 var(--radius) var(--radius) 0; color: #8b5a4b;
  }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.94em; }
  th, td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
  th { background: #FFF8F0; font-weight: 600; color: #8b6b5a; white-space: nowrap; }
  tr:hover td { background: #FFFBF8; }
  pre {
    background: #2b2420; color: #f0e0d0;
    padding: 18px 22px; border-radius: var(--radius);
    overflow-x: auto; font-size: 0.88em; line-height: 1.6; margin: 16px 0;
  }
  code { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 0.9em; }
  :not(pre) > code { background: #FFF0ED; color: #d44a4a; padding: 2px 6px; border-radius: 4px; }
  pre code { color: #f0e0d0; background: none; padding: 0; }
  ul, ol { margin: 8px 0 8px 24px; }
  li { margin: 4px 0; }
  hr { border: none; border-top: 2px dashed var(--border); margin: 32px 0; }
</style>
</head>
<body>
<div class="container"><div id="content"></div></div>
<script>
document.getElementById("content").innerHTML = marked.parse("# B2B 智能批发商城 — 系统设计文档\n\n> 版本: v2.0 | 日期: 2026-06-26 | 状态: 待入驻计划\n\n---\n\n## 一、项目概述\n\n面向下游零售商的 **儿童产品 B2B 批发商城**，以 AI 对话式下单为核心差异化能力，前端使用 uni-app 开发微信小程序。\n\n### 核心定位\n\n**品类聚焦** — 专注儿童游泳设备、儿童护肤产品、儿童健康产品三大品类，垂直精品批发。最终消费者是孩子，采购决策者是零售商，商城需要同时打动两者：让零售商看到品质和利润空间，让产品呈现传递对孩子温柔的关爱。\n\n### 核心诉求\n\n1. **B2B 批发供货** — 下游零售商可通过传统浏览或 AI 对话完成选品、议价、下单、支付全流程\n2. **店面设计服务** — 作为虚拟商品上架（\"实体店店面设计\"），配合精美历史案例图库展示设计实力，下单后由设计师线下对接交付\n3. **AI 智能客服** — 本地知识库 + 对话下单 + 用户画像记忆 + 个性化推荐，AI 取名\"小暖\"\n4. **大模型对接** — DeepSeek V4 Pro、千问等国内主流模型，支持场景化路由切换\n5. **微信小程序** — uni-app (Vue3 + TypeScript) 跨端开发，亲子温馨视觉风格\n\n### 业务规模预估\n\n- **初期阶段**: 数百 SKU，3 大品类（游泳设备 / 护肤产品 / 健康产品），垂直精品批发\n- **用户角色**: 平台管理员、零售商（买家）、运营人员、设计师\n\n---\n\n## 二、技术选型\n\n| 层面 | 技术 | 理由 |\n|------|------|------|\n| 后端框架 | Python / FastAPI | AI/NLP 生态最成熟，异步高性能 |\n| 数据库 | PostgreSQL + pgvector | JSON 灵活字段 + 向量检索（知识库 RAG） |\n| 缓存 | Redis | 会话、热数据、用户画像缓存、AI 对话状态 |\n| AI 框架 | LangChain + 自研路由层 | RAG 编排 + 模型切换 |\n| 大模型 | DeepSeek V4 Pro、千问 qwen-max | OpenAI 兼容 API，统一适配 |\n| 消息队列 | Redis Pub/Sub（初期），后续可升 RabbitMQ | 业务服务 ↔ AI 服务异步通信 |\n| 文件存储 | 阿里云 OSS / 腾讯云 COS | 商品图、案例图、上传文档 |\n| 前端 | uni-app (Vue3 + TS) + uView Plus | 微信小程序为主，架构支持扩展到其他平台 |\n| 部署 | Docker + Nginx | 容器化，便于 AI 服务独立扩缩 |\n\n---\n\n## 三、架构设计\n\n### 3.1 总体架构：模块化单体 + AI 独立服务\n\n```\n┌─────────────────────────────────────────────────────┐\n│                 Nginx (HTTPS)                       │\n└──────┬──────────────────────────────────────────────┘\n       │\n┌──────▼──────────────────────────────────────────────┐\n│              API Gateway (FastAPI 路由层)            │\n│    /api/v1/auth     /api/v1/products                │\n│    /api/v1/orders   /api/v1/payments                │\n│    /api/v1/ai/*       → 转发AI服务                   │\n└──────┬──────────────────────────┬───────────────────┘\n       │                          │\n┌──────▼──────────┐    ┌──────────▼──────────────────┐\n│ 核心业务服务     │    │     AI 服务 (独立部署)        │\n│ (FastAPI 模块)   │    │  ┌───────────────────────┐  │\n│                 │    │  │ AI对话下单引擎          │  │\n│ • 商品管理       │◄──►│  │ • 意图识别              │  │\n│ • 定价引擎       │ 内 │  │ • 对话状态机            │  │\n│ • 订单/履约      │ 部 │  │ • 订单构建器            │  │\n│ • 用户/角色      │ API│  ├───────────────────────┤  │\n│ • 支付/账期      │    │  │ 知识库引擎              │  │\n│ • 案例图库       │    │  │ • 商品知识同步          │  │\n│                 │    │  │ • RAG检索增强            │  │\n│                 │    │  │ • 文档解析摄取          │  │\n│                 │    │  ├───────────────────────┤  │\n│                 │    │  │ 用户画像 & 推荐           │  │\n│                 │    │  │ • 购买习惯分析            │  │\n│                 │    │  │ • 个性化推荐              │  │\n│                 │    │  ├───────────────────────┤  │\n│                 │    │  │ 模型路由层               │  │\n│                 │    │  │ DeepSeek V4 ←→ 千问      │  │\n│                 │    │  │ 统一适配 + 降级切换       │  │\n│                 │    │  └───────────────────────┘  │\n└──────┬──────────┘    └──────────┬──────────────────┘\n       │                          │\n┌──────▼──────────────────────────▼──────────────────┐\n│          PostgreSQL + Redis + 文件存储              │\n└────────────────────────────────────────────────────┘\n```\n\n**通信方式:**\n- 小程序 ↔ 核心业务: REST API (HTTPS)\n- 小程序 ↔ AI 服务: WebSocket（对话流）+ REST（推荐/查询）\n- 核心业务 ↔ AI 服务: 内部 REST + Redis Pub/Sub（异步事件：订单完成通知AI更新画像等）\n\n**设计原则:**\n- 业务服务模块化但不过早拆微服务 — 数百 SKU 阶段单体更高效\n- AI 服务从第一天独立部署 — 推理耗时不影响交易链路\n- 两者通过内部 API + 消息队列通信，边界清晰\n\n---\n\n## 四、视觉设计系统\n\n### 4.1 品牌调性\n\n**亲子温馨风** — 暖色调、圆润设计语言、柔软质感，传递\"给孩子最好的\"情感价值。\n\n| 维度 | 策略 |\n|------|------|\n| 主色调 | 温暖珊瑚粉 `#FF7B7B` + 奶油米白 `#FFF8F0` 为基调 |\n| 辅助色 | 柔和天空蓝 `#7EC8E3`、薄荷绿 `#A8D8B9`（与游泳/健康品类呼应） |\n| 强调色 | 蜂蜜黄 `#FFD93D`（促销标签、CTA按钮） |\n| 圆角 | 全局圆角 12-16px，卡片圆角 20px，按钮胶囊形 |\n| 字体 | 标题使用圆体/柔体风格，正文清晰易读 |\n| 图标 | 手绘插画风格，儿童元素融入（游泳圈、小鸭子、小树苗等） |\n| 阴影 | 轻柔弥散阴影，避免硬边 — `box-shadow: 0 4px 20px rgba(0,0,0,0.06)` |\n\n### 4.2 情感设计元素\n\n```\n页面氛围:\n├── 柔和渐变背景（奶油色 → 浅粉）\n├── 装饰性手绘元素轻点缀（非侵入式）\n├── 产品图圆角卡片 + 柔和倒影\n├── 儿童使用场景的温馨插画（非真实儿童照片，保护隐私）\n└── 微动效：卡片hover轻轻上浮、爱心飘动等\n\n安全/品质传递:\n├── 产品认证标识醒目展示（如安全认证、材质认证徽章）\n├── \"适合X岁+\" 友好标签\n└── 材质/成分透明化展示\n```\n\n### 4.3 图片策略\n\n- **商品图**: 白底/浅色底产品图 + 儿童使用场景图（温馨光线、生活化场景）\n- **店面设计案例图**: 全屏大图展示，支持手势缩放，瀑布流排列如 Pinterest 风格（案例图精细度高，展示设计实力）\n- **Banner**: 高精度摄影/渲染图，配合柔和渐变叠加文字\n- **图片格式**: WebP 优先，渐进式加载，懒加载\n\n### 4.4 品牌记忆点\n\n- **超级符号**: 一个温暖的小太阳/笑脸图标，贯穿首页、加载页、AI头像\n- **AI助手人格**: 取名\"小暖\"，头像为暖色卡通形象，对话语气温柔贴心但专业\n- **Slogan**: \"给孩子温柔的呵护\"\n\n---\n\n## 五、角色与权限\n\n```\n┌──────────┬──────────────────────────────────────────┐\n│ 角色      │ 权限                                      │\n├──────────┼──────────────────────────────────────────┤\n│ 管理员    │ 平台全权限：用户审核、品类管理、数据报表    │\n│          │ 定价策略配置、AI效果看板                    │\n├──────────┼──────────────────────────────────────────┤\n│ 运营人员  │ 商品上架/编辑、库存管理、订单处理          │\n│          │ 知识库内容维护、案例图库管理、促销配置      │\n├──────────┼──────────────────────────────────────────┤\n│ 零售商    │ 浏览商品、浏览案例图库、AI对话下单         │\n│          │ 订单管理、账期使用、采购报表                │\n├──────────┼──────────────────────────────────────────┤\n│ 设计师    │ 接收店面设计订单、更新交付进度              │\n│          │ 上传设计方案稿                             │\n└──────────┴──────────────────────────────────────────┘\n```\n\n**零售商入驻:** 开放注册（提交营业执照等资质）→ 平台审核 → 开通账号；同时支持后台批量导入。\n\n---\n\n## 六、核心数据模型\n\n### 6.1 用户体系\n\n```\nusers\n├── role: admin | retailer | operator | designer\n├── level: normal | silver | gold | platinum   -- 零售商等级\n├── credit_limit: Decimal     -- 账期总额度\n├── credit_balance: Decimal   -- 已用额度\n├── status: pending_review | active | frozen\n└── auth: phone + wx_openid\n\nretailer_profiles\n├── user_id → users\n├── company_name, business_license, contact_person\n├── purchase_history_summary: JSON   -- AI定期更新的购买画像摘要\n└── preferred_categories: JSON       -- 偏好品类\n\ndesigner_profiles\n├── user_id → users\n├── portfolio: JSON                  -- 作品集\n├── specializations: text[]\n└── active_orders_count: int\n```\n\n### 6.2 商品与定价\n\n```\ncategories\n├── parent_id → categories (树形)\n├── name: 儿童游泳设备 | 儿童护肤产品 | 儿童健康产品\n├── icon, sort_order\n└── status: active | hidden\n\nproducts\n├── category_id → categories\n├── name, images[], description, specs: JSON\n├── age_range: str            -- \"3-6岁\" / \"0-3岁\" / \"6岁+\"\n├── safety_certifications: JSON  -- [{\"name\":\"3C认证\",\"icon\":\"...\"}]\n├── is_virtual: bool          -- false=实物商品, true=店面设计服务\n├── virtual_detail: JSON      -- 虚拟商品专属字段(设计服务:面积/风格/预算)\n├── stock: int                -- 虚拟商品为null\n├── ai_knowledge_id → ai_knowledge_entries\n└── status: on_sale | off_sale | deleted\n\npricing_rules (每个商品的定价矩阵，JSON字段)\n示例:\n{\n  \"gold\":    [{\"qty\": 10, \"price\": 80}, {\"qty\": 50, \"price\": 72}, {\"qty\": 100, \"price\": 65}],\n  \"silver\":  [{\"qty\": 10, \"price\": 88}, {\"qty\": 50, \"price\": 79}, {\"qty\": 100, \"price\": 72}],\n  \"normal\":  [{\"qty\": 10, \"price\": 95}, {\"qty\": 50, \"price\": 85}, {\"qty\": 100, \"price\": 78}]\n}\n```\n\n### 6.3 设计案例图库\n\n```\ndesign_cases (独立于商品表，用于展示设计实力)\n├── title, description\n├── images[]                   -- 高清案例图(支持多张)\n├── category_tags[]            -- \"婴童游泳馆\" / \"母婴生活馆\" / \"儿童乐园\"\n├── style_tags[]               -- \"ins风\" / \"自然原木\" / \"卡通童趣\"\n├── store_area_range           -- \"50-100㎡\" / \"100-200㎡\" / \"200㎡+\"\n├── sort_order, is_featured    -- 是否精选(决定首页展示)\n└── status: published | draft\n```\n\n### 6.4 订单\n\n```\norders\n├── order_no: str (唯一)\n├── type: physical_goods | store_design\n├── retailer_id → users\n├── items: JSON\n│   [{\"product_id\": X, \"name\": \"儿童游泳圈\", \"qty\": 100, \"unit_price\": 35, \"subtotal\": 3500}]\n├── total_amount: Decimal\n├── pricing_snapshot: JSON      -- 下单时锁定的价格快照(防止争议)\n├── payment\n│   ├── method: wechat_pay | bank_transfer | credit\n│   ├── status: pending | paid | confirmed | overdue\n│   └── credit_used: Decimal    -- 使用账期的金额\n├── status: pending_payment → paid → shipped → confirmed → completed\n├── store_design_detail: JSON | null\n│   ├── store_area, style_preference, budget_range\n│   ├── assigned_designer_id → users\n│   ├── attachments[]           -- 店面照片/尺寸图\n│   └── delivery_progress: brief → draft → revision → finalized\n├── ai_conversation_id          -- AI对话下单的对话记录引用\n└── timeline: JSON              -- 状态变更时间线\n```\n\n---\n\n## 七、定价引擎\n\n### 7.1 价格计算流程\n\n```\n用户查看商品 → 读取用户等级(level) + 输入数量(qty)\n  → 匹配 pricing_rules[level] 找到对应阶梯\n  → 返回单价 + 总价\n  → 如低于起批数量 → 提示最低起批量\n```\n\n### 7.2 设计原则\n\n- 定价规则在商品上架时配置，下单时做**快照**固化\n- 管理员修改定价规则不影响已生成订单\n- 支持批量导入/导出定价表\n\n---\n\n## 八、支付与结算\n\n| 支付方式 | 适用场景 | 说明 |\n|----------|----------|------|\n| 微信支付 | 小额订单 | 小程序原生支持，受单笔限额 |\n| 银行转账 | 大额订单 | 上传转账凭证 → 运营后台确认 |\n| 账期授信 | 优质零售商 | gold+等级可用，按月结算，额度内免密下单 |\n\n**账期管理:**\n- 管理员为零售商设定 `credit_limit`\n- 下单时 `credit_balance + 本次金额 ≤ credit_limit` 方可使用\n- 每月生成账单，零售商还款后恢复额度\n- 逾期自动冻结账期权限\n\n---\n\n## 九、AI 对话下单引擎\n\n### 9.1 核心流程\n\n```\n用户输入 → [意图识别] → [用户画像读取] → [知识库RAG检索]\n  → [LLM生成回复+操作指令] → [返回富消息给前端]\n  → 循环直到订单确认\n```\n\n### 9.2 意图类型（儿童产品场景示例）\n\n| 意图 | 说明 | 示例 |\n|------|------|------|\n| `recommend` | 推荐商品 | \"3岁宝宝用哪种游泳圈合适\" |\n| `search` | 搜索查询 | \"有没有防晒的儿童护肤品\" |\n| `order` | 下单操作 | \"第一款拿100件\" |\n| `negotiate` | 议价/数量协商 | \"200件能便宜点吗\" |\n| `query` | 信息查询 | \"这款有安全认证吗，适合多大孩子\" |\n| `reorder` | 补货 | \"夏天快到了，上次的游泳装备再来一批\" |\n\n### 9.3 对话状态机\n\n```\nIDLE → RECOMMENDING (推荐中) → BUILDING_ORDER (构建订单) → CONFIRMING (确认中) → COMPLETED\n  │         │                        │                      │\n  └─────────┴────────────────────────┴──────────────────────┘\n                    任意状态可回退到IDLE (取消/重置)\n```\n\n### 9.4 订单构建器\n\n从对话上下文中提取结构化订单信息：\n- 商品 ID、数量\n- 匹配价格（用户等级 × 数量阶梯）\n- 支付方式偏好\n- 生成 `orders` 记录并返回订单号\n\n订单构建器在创建订单前必须通过校验：商品存在、库存充足、金额正确。校验失败时回传 AI 生成错误提示。\n\n### 9.5 富消息类型\n\n| 消息类型 | 内容 | 触发时机 |\n|----------|------|----------|\n| `text` | 纯文本 | 普通对话 |\n| `product_card` | 商品缩略图+名称+批发价+适龄标签+库存 | 商品推荐 |\n| `order_confirm` | 商品清单+数量+价格+支付方式选择 | 订单待确认 |\n| `order_result` | 订单号+状态+预计送达 | 下单成功 |\n| `quick_replies` | 快捷回复按钮 | 引导用户选择 |\n\n---\n\n## 十、知识库引擎\n\n### 10.1 知识来源\n\n| 来源 | 方式 | 更新频率 |\n|------|------|----------|\n| 商品基础信息 | 自动同步 name/description/specs/age_range → 向量嵌入 | 商品变更时实时 |\n| 商品卖点话术 | 运营手动录入或文档上传 | 按需 |\n| FAQ 问答对 | 手动录入 + 上传文档自动解析 | 按需 |\n| 安全认证知识 | 儿童产品相关的认证标准、材质知识录入 | 按需 |\n| 成功对话沉淀 | AI 自动标记有效推荐链 → 提取加入知识库 | 运营审核后 |\n\n### 10.2 技术实现\n\n```\n知识摄取流程:\n  手动文本/文档上传 → 分段(Chunking) → Embedding(向量化)\n    → pgvector 存储 → 更新索引\n\n检索流程(RAG):\n  用户问题 → Embedding → pgvector 相似度搜索 → Top-K结果\n    → 注入LLM上下文 → 生成回复\n```\n\n### 10.3 文档解析支持\n\n- PDF: PyPDF2 / pdfplumber\n- Word: python-docx\n- Excel: openpyxl（批量商品信息导入同时生成知识条目）\n- 纯文本/富文本: 直接分段处理\n\n### 10.4 学习机制\n\n- **正向强化**: 对话最终成功下单 → 该轮对话链标记为有效 → 提取关键推荐话术 → 运营审核后入库\n- **负向惩罚**: 用户明确纠正(\"不对，我要的是XX\") → 降低对应知识条目权重\n- **趋势学习**: 统计高频问题 → 自动生成 FAQ 草稿 → 运营确认发布\n- **季节性知识**: 自动识别儿童产品季节性（游泳设备夏季热销、护肤品秋冬需求大）→ 知识库权重随季节调整\n\n---\n\n## 十一、用户画像与推荐引擎\n\n### 11.1 画像维度\n\n| 维度 | 数据来源 | 说明 |\n|------|----------|------|\n| 品类偏好 | 历史订单品类分布 | 偏游泳还是护肤还是健康，加权 |\n| 适龄段偏好 | 历史商品 age_range | 零售商服务的核心儿童年龄段 |\n| 价格带偏好 | 历史订单单价区间 | 偏好价位段 |\n| 品牌偏好 | 历史订单品牌分布 | 复购品牌识别 |\n| 采购周期 | 订单时间间隔分析 | 预测补货时间 |\n| 采购量偏好 | 历史每单数量 | 推荐匹配的阶梯价档位 |\n| 季节性偏好 | 品类×月份交叉分析 | 游泳设备夏季、护肤入秋等 |\n| 对话偏好 | AI对话中的交互风格 | 简洁型/详细型 |\n\n### 11.2 推荐场景\n\n| 场景 | 触发方式 | 说明 |\n|------|----------|------|\n| 首页推荐 | 被动展示 | 基于画像的个性化商品推荐 |\n| AI对话推荐 | 主动触发 | 用户发起对话时结合画像做推荐 |\n| 补货提醒 | 推送通知 | 根据采购周期+季节预测，主动提醒补货 |\n| 新品匹配 | 推送通知 | 新商品匹配零售商偏好时通知 |\n| 季节换品 | 推送通知 | 换季前提醒采购应季品类 |\n\n### 11.3 画像更新\n\n- 订单完成后异步更新（Redis Pub/Sub 触发）\n- AI 对话结束后批量更新交互偏好\n- 每周离线全量重算画像摘要（存入 `retailer_profiles.purchase_history_summary`）\n\n---\n\n## 十二、大模型路由层\n\n### 12.1 架构\n\n```\n┌─────────────────────────────────────┐\n│        模型适配器 (统一 OpenAI 兼容)  │\n│  POST /ai/chat/completions          │\n│  POST /ai/embeddings                │\n└──────────────┬──────────────────────┘\n               │\n┌──────────────▼──────────────────────┐\n│         路由策略 (配置驱动)           │\n│                                     │\n│  默认分配:                           │\n│  • 对话下单 → DeepSeek V4 Pro        │\n│  • 商品推荐 → 千问 qwen-max          │\n│  • 知识RAG  → 按场景择优             │\n│                                     │\n│  容灾策略:                           │\n│  • 主模型超时/故障 → 自动切备用       │\n│  • 速率限制 + 重试 + 退避             │\n│  • 调用日志 + 效果对比看板            │\n└──────────────┬──────────────────────┘\n               │\n┌──────────────▼──────────────────────┐\n│  ┌──────────┐  ┌──────────┐         │\n│  │DeepSeek  │  │  千问    │  可扩展  │\n│  │V4 Pro    │  │ qwen-max │         │\n│  └──────────┘  └──────────┘         │\n└─────────────────────────────────────┘\n```\n\n### 12.2 设计要点\n\n- 两个模型均提供 OpenAI 兼容 API，适配层代码量小\n- 路由策略通过配置文件/后台管理界面可调，无需改代码\n- 所有调用记录日志（延迟、Token 消耗、成功/失败），为 A/B 测试提供数据\n- 本地知识库的 Embedding 模型独立选择（可用国内 Embedding 服务如百川/智谱）\n\n---\n\n## 十三、前端设计（uni-app 微信小程序）\n\n### 13.1 整体风格\n\n遵循第四章视觉设计系统，全站统一的亲子温馨调性：\n- 奶油米白底色 + 珊瑚粉点缀\n- 圆角卡片 + 手绘图标\n- 柔和微动效\n- 产品图圆角倒影 + 适龄标签 + 安全认证徽章\n\n### 13.2 页面结构\n\n```\nTabBar (5个入口)\n├── 🏠 首页\n│   ├── Hero 区：精选案例大图轮播（全屏/半屏，视觉冲击力强）\n│   ├── 搜索栏（文字 + 语音）\n│   ├── 品类导航（游泳设备 | 护肤产品 | 健康产品，手绘大图标）\n│   ├── \"小暖推荐\"智能推荐区（基于画像的个性化商品Feed）\n│   ├── 精选案例瀑布流（店面设计案例，Pinterest风格双列展示）\n│   └── 促销/新品Banner（柔和渐变叠加）\n│\n├── 💬 小暖AI（核心差异化入口）\n│   ├── 对话列表（多轮对话）\n│   ├── 富消息卡片（商品卡含适龄标签、订单确认卡）\n│   ├── 快捷入口：今日推荐 / 补货提醒 / 查订单\n│   └── 语音输入（针对忙碌的零售商老板）\n│\n├── 🎨 案例（店面设计案例库）\n│   ├── 瀑布流展示（Pinterest风格，高清大图优先）\n│   ├── 筛选：按风格 / 面积 / 类型\n│   ├── 案例详情：全屏大图浏览 + 手势缩放\n│   ├── 关联设计服务商品入口\n│   └── 收藏/分享\n│\n├── 📦 商品\n│   ├── 品类浏览 + 筛选（适龄、认证、品牌、价格）\n│   ├── 商品详情（批发价阶梯表、适龄标签、认证展示、库存）\n│   ├── 关联案例展示（如该商品在案例图中的实际应用）\n│   └── 收藏 / 购物车\n│\n└── 👤 我的\n    ├── 零售商信息 / 等级 / 资质\n    ├── 账期额度 / 账单\n    ├── 采购报表（AI生成：采购分析+品类建议）\n    └── 设置 / 客服\n```\n\n### 13.3 首页视觉策略\n\n首页是品牌第一印象，承担\"视觉冲击 + 高效转化\"双重任务：\n\n```\n┌─────────────────────────────────┐\n│       [Banner轮播 - 全屏]        │  ← 精选案例大图，自动轮播\n│   精美案例图 + 柔和渐变文字叠加   │     3-5张高精度图，展示设计实力\n├─────────────────────────────────┤\n│  🔍 搜索你想找的儿童产品...      │  ← 搜索栏\n├─────────────────────────────────┤\n│  [🏊]  [🧴]  [💊]               │  ← 品类导航\n│  游泳   护肤   健康               │     手绘大图标 + 柔和色块\n├─────────────────────────────────┤\n│  ☀️ 小暖推荐  ›                 │  ← AI个性化推荐Feed\n│  ┌──────┐ ┌──────┐ ┌──────┐    │\n│  │ 商品  │ │ 商品  │ │ 商品  │    │     横向滑动卡片\n│  │ 卡片  │ │ 卡片  │ │ 卡片  │    │     含适龄标签+批发价\n│  └──────┘ └──────┘ └──────┘    │\n├─────────────────────────────────┤\n│  🎨 设计案例  ›                 │  ← 精选案例瀑布流\n│  ┌────┐ ┌────┐ ┌────┐ ┌────┐  │\n│  │ 图 │ │ 图 │ │ 图 │ │ 图 │  │     双列瀑布流\n│  └────┘ └────┘ └────┘ └────┘  │     直接展示设计实力\n├─────────────────────────────────┤\n│  🔥 促销专区                    │  ← 促销Banner\n└─────────────────────────────────┘\n```\n\n**设计要点:**\n- Hero Banner 使用店面设计案例图（非商品图），展示超高质量视觉——因为案例图比商品图更有视觉冲击力\n- 案例瀑布流直接在首页露出，让零售商一眼认可设计能力\n- \"小暖推荐\"标签使用AI头像，强化品牌IP\n- 品类导航图标使用手绘风格 + 品类专属色（游泳=天空蓝、护肤=珊瑚粉、健康=薄荷绿）\n\n### 13.4 技术栈\n\n```\n前端: uni-app (Vue3 + TypeScript)\nUI框架: uView Plus\n状态管理: Pinia\nHTTP: uni.request + 拦截器封装\nWebSocket: uni.connectSocket（AI对话通道）\n语音: uni.getRecorderManager → 音频流 → AI服务 ASR\n推送: uniPush（订单状态、促销、补货提醒）\n图片: uni.previewImage（案例图全屏浏览 + 手势缩放）\n瀑布流: 自定义组件，双列自适应高度\n```\n\n### 13.5 AI 对话界面要点\n\n- WebSocket 长连接保持对话实时性\n- 支持流式输出（AI 回复逐字展示，降低等待感）\n- 富消息卡片组件化（product_card 含适龄标签 / order_confirm / order_result / quick_replies）\n- 语音消息：录音 → 上传 → AI 服务 ASR 转文字 → 进入对话流程\n- AI头像使用\"小暖\"卡通形象，对话气泡圆角柔和\n\n---\n\n## 十四、分阶段开发路线\n\n### Phase 1：MVP 核心交易链路 + 品牌视觉（预计 4-6 周）\n\n**目标:** 亲子温馨风格小程序上线，零售商可浏览商品和案例、手动下单、支付\n\n| 模块 | 内容 |\n|------|------|\n| 核心业务服务 | 商品管理（含适龄/认证字段）、用户体系、定价引擎、订单/履约、支付 |\n| 设计师案例图库 | design_cases CRUD + 图片管理 + 精选标记 |\n| 小程序前端 | 5个Tab（首页/小暖AI占位/案例/商品/我的），传统浏览下单流程 |\n| 视觉落地 | 亲子温馨风完整落地：配色、圆角、手绘图标、图片策略 |\n| 支付 | 微信支付 + 银行转账（账期功能 Phase 3 补） |\n| 管理后台 | 商品上架、案例图库管理、订单处理、用户审核 |\n| 设计师流程 | 虚拟商品购买 → 后台指派设计师 → 交付跟踪 |\n\n### Phase 2：AI 对话下单（预计 4-5 周）\n\n**目标:** \"小暖\"AI助手 Tab 上线，支持全程对话下单\n\n| 模块 | 内容 |\n|------|------|\n| AI 服务 | 独立部署，对话引擎 + 知识库 + 模型路由 |\n| 小程序 | \"小暖AI\" Tab 激活，富消息卡片组件 |\n| 引擎 | 意图识别 + 对话状态机 + 订单构建器 |\n| 知识库 | 商品信息自动同步 + 手动录入 + 儿童产品安全知识 |\n| 模型路由 | DeepSeek V4 Pro 优先（千问 Phase 3 接入） |\n| 通道 | WebSocket 对话 + 流式输出 |\n\n### Phase 3：智能推荐 + 知识库深化（预计 3-4 周）\n\n**目标:** \"小暖\"记住用户习惯，主动精准推荐\n\n| 模块 | 内容 |\n|------|------|\n| 用户画像 | 多维画像构建（含适龄段偏好、季节偏好） |\n| 推荐引擎 | 首页推荐 / 对话推荐 / 补货提醒 / 新品匹配 / 季节换品 |\n| 知识库 | 文档上传解析 + 对话自动学习沉淀 + 季节权重调整 |\n| 千问接入 | 推荐场景路由到千问 |\n| 账期管理 | 授信额度 + 账单 + 还款管理 |\n| 看板 | 管理员 AI 效果分析看板 |\n\n### Phase 4：优化与运营（持续迭代）\n\n- AI 对话效果 A/B 测试\n- 采购分析报表（AI 生成摘要 + 品类建议）\n- 促销活动引擎\n- 案例图库 UGC（设计师主动上传案例 → 运营审核上架）\n- 性能压测与优化\n\n---\n\n## 十五、非功能需求\n\n| 维度 | 要求 |\n|------|------|\n| 性能 | API 响应 < 200ms (P95), AI回复首Token < 2s, 案例大图渐进加载首屏 < 1.5s |\n| 安全 | HTTPS + JWT认证 + 敏感数据加密 + SQL注入防护 |\n| 可用性 | 核心交易链路 99.9%, AI服务 99.5% |\n| 扩展性 | AI服务可水平扩展，模型路由可热切换 |\n| 图片 | WebP格式优先，CDN加速，案例图支持渐进式加载 |\n| 合规 | 用户数据隐私合规，营业执照等资质数据加密存储，儿童产品宣传合规 |\n\n---\n\n## 十六、风险与应对\n\n| 风险 | 影响 | 应对 |\n|------|------|------|\n| AI 对话下单转化率低 | 核心差异化失效 | Phase 2 上线后快速 A/B 测试，对比传统下单转化率 |\n| 大模型 API 不稳定 | 对话功能不可用 | 双模型互备降级 + 固定话术兜底 |\n| 微信小程序审核 | 上线延迟 | 提前准备审核材料，AI功能做好降级方案 |\n| 知识库冷启动 | 初期推荐不准 | Phase 1 先积累订单数据，Phase 2 知识库人工录入先行 |\n| 案例图版权 | 法律风险 | 仅展示已交付项目的授权图片，合同约定使用权 |\n| 儿童产品合规 | 宣传风险 | 适龄标签/认证展示务必真实准确，AI话术需审核 |\n| 账期坏账 | 资金风险 | 严格准入审核 + 额度阶梯释放 + 逾期自动冻结 |\n");
