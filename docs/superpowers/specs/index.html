<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2B 儿童产品批发商城 — 系统设计文档 v2.0</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #FFF8F0; --card-bg: #ffffff; --text: #4a3728;
    --text-secondary: #7a6a5a; --border: #f0e0d0;
    --accent: #FF7B7B; --accent-light: #FFF0ED;
    --blue: #7EC8E3; --green: #A8D8B9; --yellow: #FFD93D;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #FFF8F0 0%, #FFF0ED 50%, #FFF8F0 100%);
    color: var(--text); line-height: 1.8;
    padding: 40px 20px;
  }
  .container {
    max-width: 920px; margin: 0 auto;
    background: var(--card-bg); border-radius: 24px;
    box-shadow: 0 2px 8px rgba(255,123,123,0.06), 0 8px 32px rgba(0,0,0,0.04);
    padding: 60px 64px;
  }
  @media (max-width: 768px) {
    .container { padding: 28px 22px; border-radius: 16px; }
    body { padding: 16px 10px; }
  }
  h1 { font-size: 2em; margin-bottom: 6px; color: #FF7B7B; letter-spacing: -0.02em; }
  h2 { font-size: 1.4em; margin: 44px 0 14px; padding-bottom: 10px; border-bottom: 2px solid var(--border); color: #5a3e2b; }
  h3 { font-size: 1.15em; margin: 28px 0 10px; color: #6b4c3b; }
  h4 { font-size: 1.05em; margin: 20px 0 8px; color: var(--text); }
  p { margin: 10px 0; }
  strong { color: #3a2010; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  blockquote {
    border-left: 4px solid var(--accent); background: var(--accent-light);
    padding: 12px 20px; margin: 16px 0;
    border-radius: 0 var(--radius) var(--radius) 0; color: #8b5a4b;
  }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.94em; }
  th, td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
  th { background: #FFF8F0; font-weight: 600; color: #8b6b5a; white-space: nowrap; }
  tr:hover td { background: #FFFBF8; }
  pre {
    background: #2b2420; color: #f0e0d0;
    padding: 18px 22px; border-radius: var(--radius);
    overflow-x: auto; font-size: 0.88em; line-height: 1.6; margin: 16px 0;
  }
  code { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 0.9em; }
  :not(pre) > code { background: #FFF0ED; color: #d44a4a; padding: 2px 6px; border-radius: 4px; }
  pre code { color: #f0e0d0; background: none; padding: 0; }
  ul, ol { margin: 8px 0 8px 24px; }
  li { margin: 4px 0; }
  hr { border: none; border-top: 2px dashed var(--border); margin: 32px 0; }
</style>
</head>
<body>
<div class="container"><div id="content"></div></div>
<script>
fetch('2026-06-26-b2b-mall-design.md')
  .then(r => r.text())
  .then(md => { document.getElementById('content').innerHTML = marked.parse(md); });
</script>
</body>
</html>
